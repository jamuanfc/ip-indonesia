name: Update feed IP

on:
  schedule:
    - cron: "0 22 * * *"          # 05:00 WIB setiap hari
  push:
    branches: [master]
    paths: [asn_tambahan.txt, build_feed.py, test_build_feed.py]
  workflow_dispatch:               # tombol "Run workflow" di tab Actions

permissions:
  contents: write                  # hanya untuk commit hasil ke repo ini

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Uji pengaman skrip
        run: python3 test_build_feed.py

      - name: Bangun feed (gagal = tidak ada file yang diubah)
        run: python3 build_feed.py

      - name: Commit bila berubah
        run: |
          git config user.name "ip-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.csv'
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan."
            exit 0
          fi
          git commit -m "Update feed IP - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
